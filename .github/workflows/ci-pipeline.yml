name: ML Infrastructure CI Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Linting & Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Audit Python Syntax Across All Distributed Modules
        run: |
          python -m py_compile *.py
          echo "✅ All Python infrastructure modules passed bytecode compilation!"

      - name: Validate Declarative Grafana Dashboard JSON
        run: |
          python -m json.tool ray-grafana-dashboard.json > /dev/null
          echo "✅ Grafana Dashboard JSON syntax verified!"

      - name: Validate Kubernetes & Prometheus YAML Manifests
        run: |
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('*.yml')]"
          echo "✅ All Kubernetes and Prometheus YAML manifests parsed cleanly!"
