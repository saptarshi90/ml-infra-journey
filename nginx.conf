events { worker_connections 1024; }

http {
    server {
        listen 80;

        # Route traffic hitting http://localhost:8080/node1 to your first node
        location /node1 {
            proxy_pass http://compose-node-1:80;
            proxy_set_header Host $host;
        }

        # Route traffic hitting http://localhost:8080/node2 to your second node
        location /node2 {
            proxy_pass http://compose-node-2:80;
            proxy_set_header Host $host;
        }
    }
}
