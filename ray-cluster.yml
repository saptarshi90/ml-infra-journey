apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-ml-cluster
  namespace: default
spec:
  rayVersion: '2.59.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '127.0.0.1'
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.59.0
            imagePullPolicy: IfNotPresent
            # Optimization Fix: Forcefully block the 9 heavy UI subprocess modules from booting!
            command: ["ray", "start", "--head", "--port=6379", "--dashboard=false", "--block"]
            ports:
              - containerPort: 6379
                name: gcs
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "400m"
                memory: "512Mi"
  workerGroupSpecs:
    - groupName: worker-gpu-group
      replicas: 1
      minReplicas: 1
      maxReplicas: 2
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.59.0
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "400m"
                  memory: "512Mi"
